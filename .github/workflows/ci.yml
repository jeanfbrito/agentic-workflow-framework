name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck
        # SC2088 (tilde in quotes not expanded) is accepted throughout the
        # install/uninstall scripts -- they intentionally document literal
        # paths like "~/.claude/..." in echo strings.
        run: shellcheck -e SC2088 install.sh verify.sh uninstall.sh hooks/*.sh .githooks/commit-msg

      - name: Bash syntax check
        run: |
          for f in install.sh verify.sh uninstall.sh hooks/*.sh .githooks/commit-msg; do
            bash -n "$f"
          done

      - name: Validate plugin JSON
        run: |
          jq . .claude-plugin/plugin.json
          jq . .claude-plugin/marketplace.json

      - name: Agent count consistency
        run: |
          AGENT_COUNT=$(ls agents/*.md | wc -l | tr -d ' ')
          CLAIMED=$(grep -oE '[0-9]+ subagent' .claude-plugin/plugin.json | grep -oE '[0-9]+')
          echo "agents/*.md: $AGENT_COUNT files -- plugin.json claims: $CLAIMED subagent roles"
          if [ "$AGENT_COUNT" != "$CLAIMED" ]; then
            echo "Mismatch: agents/*.md has $AGENT_COUNT files but plugin.json claims $CLAIMED subagent roles" >&2
            exit 1
          fi

      - name: Python unit tests
        run: python3 -I -m unittest discover -s tests -p 'test_*.py' -v

      - name: Set temp HOME for install/uninstall smoke tests
        run: echo "HOME=$(mktemp -d)" >> "$GITHUB_ENV"

      - name: Install smoke test
        run: bash install.sh --yes

      - name: Verify smoke test
        run: bash verify.sh

      - name: Uninstall smoke test
        run: bash uninstall.sh --yes

  # Windows: Git Bash, the python.org interpreter as `python`, and no `python3`
  # guarantee. The same install, verify and uninstall smoke tests as Linux,
  # in copy mode and in --link mode.
  windows-smoke:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Line endings are LF in the checkout
        run: |
          if git ls-files --eol | grep -E 'w/crlf'; then
            echo "CRLF found in the checkout. Check .gitattributes." >&2
            exit 1
          fi

      - name: Python unit tests
        run: python -I -m unittest discover -s tests -p 'test_*.py' -v

      - name: Set temp HOME for install/uninstall smoke tests
        # Python on Windows reads USERPROFILE, not HOME, for "~". Set both.
        run: |
          h=$(cygpath -m "$RUNNER_TEMP/home")
          mkdir -p "$h"
          echo "HOME=$h" >> "$GITHUB_ENV"
          echo "USERPROFILE=$(cygpath -w "$h")" >> "$GITHUB_ENV"

      - name: Install smoke test
        run: bash install.sh --yes

      - name: Verify smoke test
        run: bash verify.sh

      - name: Uninstall smoke test
        run: bash uninstall.sh --yes

      - name: Install --link smoke test
        run: |
          bash install.sh --yes --link
          for s in "$HOME"/.claude/skills/*/; do
            s=${s%/}
            [ -L "$s" ] || { echo "$s is not a link" >&2; exit 1; }
          done

      - name: Uninstall after --link keeps the repo files
        run: |
          bash uninstall.sh --yes
          test -f skills/agentic-workflow/SKILL.md
